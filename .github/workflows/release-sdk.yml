on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      with:
        persist-credentials: false
    - name: Setup .NET
      uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
      with:
        dotnet-version: 5.0.x
    - name: Install dependencies
    - name: Test
      run: dotnet test src/sdk/Core/Microsoft.UnifiedRedisPlatform.Core.csproj --no-restore --verbosity normal
    - name: Pack
      run: dotnet pack src/sdk/Core/Microsoft.UnifiedRedisPlatform.Core.csproj --output ./artifacts
    - name: Upload package
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: nupkg
        path: artifacts/*.nupkg
        if-no-files-found: error

  # Publish runs without checking out repo code, so build/test-time code never has access to the NuGet key.
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: nuget-publish
    steps:
    - name: Download package
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      with:
        name: nupkg
        path: artifacts
    - name: Publish
      run: dotnet nuget push "artifacts/*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json
      env:
        NUGET_API_KEY: ${{ secrets.NuGet_API_Key }}