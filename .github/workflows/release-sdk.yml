on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Setup .NET
      uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
      with:
        dotnet-version: 5.0.x
    - name: Install dependencies
    - name: Test
      run: dotnet test src/sdk/Core/Microsoft.UnifiedRedisPlatform.Core.csproj --no-restore --verbosity normal
    - name: Pack
      run: dotnet pack src/sdk/Core/Microsoft.UnifiedRedisPlatform.Core.csproj --output ./artifacts
    - name: Upload package
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: nupkg
        path: artifacts/*.nupkg
        if-no-files-found: error

  # Publish runs without checking out repo code, so build/test-time code never has access to the NuGet key.
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: nuget-publish
    steps:
    - name: Download package
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: nupkg
        path: artifacts
    - name: Publish
      run: dotnet nuget push "artifacts/*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json
      env:
        NUGET_API_KEY: ${{ secrets.NuGet_API_Key }}